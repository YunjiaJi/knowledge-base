<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人知识库</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#202938;--muted:#687386;--line:#e4e9f0;--accent:#426b9b;--soft:#edf3fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:28px max(22px,calc((100% - 1120px)/2))}h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:var(--muted)}main{max-width:1120px;margin:26px auto;padding:0 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input{flex:1;min-width:230px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;color:var(--ink);cursor:pointer}button.active{background:var(--soft);border-color:#b9cce0;color:#244d79}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px}.sidebar,.content{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{padding:14px;height:max-content}.sidebar h3{margin:4px 8px 10px;font-size:14px;color:var(--muted)}.cat{display:flex;width:100%;justify-content:space-between;text-align:left;margin:4px 0}.cat small{color:var(--muted)}.content{padding:20px}.content h2{margin:0 0 3px;font-size:21px}.sub{color:var(--muted);margin:0 0 18px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}.card h3{margin:0 0 5px;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-bottom:8px}.card p{margin:7px 0}.card details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.card summary{cursor:pointer;color:var(--accent);font-weight:600}.tag{display:inline-block;background:#f0f3f7;color:#526174;padding:2px 7px;border-radius:6px;font-size:11px;margin:2px 4px 2px 0}.empty{color:var(--muted);padding:30px;text-align:center}.footer{color:var(--muted);font-size:12px;margin:18px 2px}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;gap:5px}.sidebar h3{width:100%}.cat{width:auto}.cards{grid-template-columns:1fr}}
</style></head><body><header><h1>个人知识库</h1><p>把基础原理、技术方法、论文理解与专业英语连接起来。</p></header><main><div class="toolbar"><input id="q" placeholder="搜索知识点、公式、关键词……"><button id="all" class="active">全部知识</button><button id="clear">清空搜索</button></div><div class="layout"><aside class="sidebar"><h3>知识分类</h3><div id="cats"></div></aside><section class="content"><h2 id="heading">全部知识</h2><p class="sub" id="desc">按分类浏览，也可以搜索标题、解释和标签。</p><div id="cards" class="cards"></div><div class="footer" id="count"></div></section></div></main><script>
const files=[["math","数学与物理基础"],["ai","计算机与人工智能基础"],["driving","自动驾驶与研究方法"],["papers","论文知识库"],["english","英语词汇库"]];
const embedded={"math":[{"category":"math","type":"公式与物理概念","title":"功率、力与速度：P = F · v","summary":"功率表示做功快慢；当力与速度方向一致时，功率等于驱动力与速度的乘积。","formula":"P = F · v","tags":["功率","力学","车辆加速"],"sections":[{"heading":"物理意义","body":"P是功率（W），F是沿运动方向的力（N），v是速度（m/s）。功率相同，速度越高，可提供的驱动力越小；驱动力相同，速度越高，所需功率越大。"},{"heading":"公式来源","body":"功率定义为单位时间内做功：P=W/t。恒力沿运动方向做功 W=F·s，且 v=s/t，因此 P=F·v。"},{"heading":"汽车例子","body":"车辆起步时速度较低，在动力系统允许范围内可以提供较大的驱动力；车速升高后，在功率受限时可用驱动力会下降。"}],"related":["车辆纵向动力学","运动学"]},{"category":"math","type":"数学基础","title":"正弦与余弦：sin、cos","summary":"三角函数描述角度与边长比例，也可用于把向量分解到不同方向。","formula":"sin θ = 对边 / 斜边；cos θ = 邻边 / 斜边","tags":["三角函数","向量分解"],"sections":[{"heading":"直角三角形中的含义","body":"对于给定角θ，sinθ是对边与斜边之比，cosθ是邻边与斜边之比。角度变化时，比例也随之变化。"},{"heading":"力的分解","body":"若重力G沿斜面方向和垂直斜面方向分解，斜面方向分量为G sinθ，法向分量为G cosθ（θ为斜面与水平面的夹角）。"},{"heading":"常见混淆","body":"sinθ与cosθ不是边长本身，而是无量纲的比例。具体哪个分量乘sin或cos，取决于角度是相对于哪条边定义的。"}],"related":["向量分解","斜面受力分析"]}],"ai":[{"category":"ai","type":"Python / 张量操作","title":"Python切片：[:, 0:1, 2:3]","summary":"对三维张量按各维度选取范围；冒号表示该维度取完整范围，不表示无限。","tags":["Python","Tensor","切片"],"sections":[{"heading":"逐维解释","body":"假设张量形状为 (B,T,C)，[:, 0:1, 2:3] 表示：第0维全部保留；第1维取索引0（保留长度1）；第2维取索引2（保留长度1）。"},{"heading":"为什么用0:1而不是0","body":"0:1会保留该维度，结果仍是三维张量；单独写0通常会压缩该维度。切片右端不包含在范围内。"}],"example":"若 predict_traj 的形状是 (B,T,3)，predict_traj[:,0:1,2:3] 取第一个预测时刻的第3个通道，并保留维度。","related":["PyTorch Tensor","torch.cat()"]},{"category":"ai","type":"PyTorch函数","title":"torch.cat() 与 dim 参数","summary":"torch.cat() 沿指定的已有维度拼接多个张量；dim决定拼接轴。","tags":["PyTorch","张量拼接"],"sections":[{"heading":"基本形式","body":"torch.cat((tensor1,tensor2,...), dim=1) 将张量沿第1维拼接。除拼接维度外，其他维度大小必须一致。"},{"heading":"与stack的区别","body":"cat沿已有维度拼接，不增加维度；stack会新增一个维度，再把张量堆叠起来。"}],"example":"torch.cat((pose[:,1:condition_frames], predict_pose), dim=1) 通常表示沿时间维拼接历史片段与新预测位姿。","related":["Python切片","Tensor维度"]},{"category":"ai","type":"模型机制","title":"自回归生成（Autoregressive Generation）","summary":"模型把前一步生成结果作为后续输入，逐步产生序列。","tags":["自回归","世界模型","生成模型"],"sections":[{"heading":"基本过程","body":"给定初始条件，模型生成下一步或一段未来；再把生成结果接回输入，继续生成后续内容。"},{"heading":"误差累积","body":"如果后续步骤持续使用模型自己的预测，而不重新输入真实观测，早期误差可能传递并累积。实际程度取决于模型结构、训练方式和反馈机制。"},{"heading":"与一次性多步预测的区别","body":"一次性多步预测在一次推理中输出多个未来点；自回归预测则通过多轮迭代延长序列。两者不是同一个概念。"}],"related":["Epona论文卡片","开环与闭环评价"]}],"driving":[{"category":"driving","type":"坐标与运动","title":"车辆坐标系中的 Pose 与 Yaw","summary":"Pose描述位置，Yaw描述绕竖直轴的航向角；必须明确参考坐标系和角度正方向。","tags":["坐标系","Pose","Yaw"],"sections":[{"heading":"Pose","body":"在常见二维车辆平面表示中，Pose可包含纵向位置X和横向位置Y；在完整刚体位姿中还包括三维位置和姿态。"},{"heading":"Yaw","body":"Yaw通常表示绕竖直轴的旋转角。相对Yaw可以是相对于某个参考时刻的累计角度，也可以是相邻时刻角度增量，必须看数据定义。"},{"heading":"坐标变换","body":"把全局位姿转换到车辆局部坐标系时，需要考虑参考车辆姿态，不能简单地对全局X、Y分别作差。"}],"related":["旋转矩阵","Epona论文卡片"]},{"category":"driving","type":"轨迹评价指标","title":"L2、ADE 与 FDE","summary":"L2描述单个时刻的位置误差；ADE是整个预测时域内逐点位置误差的平均；FDE是最后一个预测时刻的位置误差。","formula":"L2_t = √((x̂_t − x_t)² + (ŷ_t − y_t)²)","tags":["轨迹预测","评价指标","ADE","FDE"],"sections":[{"heading":"单点L2","body":"在某一个预测时刻，预测位置与真实位置的欧氏距离。它不是平均值，除非明确对多个点再求平均。"},{"heading":"ADE","body":"Average Displacement Error，对预测时域内各时刻的位置误差求平均。若有N个预测点，ADE = (1/N) Σ L2_t。"},{"heading":"FDE","body":"Final Displacement Error，只计算最后一个预测点的位置误差。"}],"example":"1s、2s、3s对应的L2分别为0.54m、1.53m、2.41m时，3s L2是最后一个时刻误差；不能把它当作ADE。","related":["Pose与Yaw","Epona论文卡片"]},{"category":"driving","type":"碰撞几何","title":"二维有向包围框（OBB）与分离轴定理（SAT）","summary":"OBB用带方向的矩形近似目标占用区域；SAT通过检查候选分离轴上的投影是否分离，判断两个凸多边形是否相交。","tags":["OBB","SAT","碰撞检测"],"sections":[{"heading":"OBB是什么","body":"Oriented Bounding Box是有朝向的包围矩形。车辆通常用长、宽和航向角确定矩形的位置与方向，比忽略朝向的轴对齐包围框更贴近车辆外形。"},{"heading":"SAT原理","body":"若存在一条轴，使两个凸多边形在该轴上的投影区间互不重叠，则二者不相交；若所有候选轴上的投影都重叠，则多边形相交。对矩形，通常检查双方边的法向轴。"},{"heading":"使用限制","body":"碰撞判断依赖位置、尺寸、航向角、时间对齐和坐标变换。标注缺失或目标状态不确定时，不能简单当作无碰撞。"}],"related":["车辆坐标系","Collision Occurrence"]}],"papers":[{"category":"papers","type":"论文卡片 · 初始记录","title":"Epona：世界模型与长时域轨迹预测","summary":"当前已讨论的核心问题：利用一段历史观测生成未来场景，并预测多步连续轨迹；关注多步预测、自回归执行与视觉生成的关系。","tags":["World Model","Trajectory Prediction","Diffusion","NuPlan"],"sections":[{"heading":"研究目标（当前学习笔记）","body":"探索世界模型如何基于历史观测生成未来场景和轨迹，为长时域预测与规划研究提供模型基础。这里是根据目前讨论形成的学习摘要，不替代论文原文的正式表述。"},{"heading":"已讨论的关键机制","body":"论文涉及一次性多步轨迹预测、连续动作表示，以及视频生成与轨迹预测的联合问题。需要区分模型单轮输出多个未来点，与测试脚本中滑动窗口/自回归执行的具体逻辑。"},{"heading":"当前复现记录","body":"已在nuScenes场景上复现轨迹评价，比较方法A（单轮完整多点预测）与方法B（连续轮次取首个预测点并进行位姿复合）。目前多个正常场景中B的ADE较低，但存在明显偏离场景；视频生成在部分场景后期出现视觉失真。"},{"heading":"后续需要补充","body":"论文完整引文与版本、正式架构图、训练数据与配置、作者原始指标、消融实验、碰撞评价协议，以及当前复现与论文设置的差异。未核实的细节不在此卡片中推断。"}],"related":["自回归生成","L2、ADE与FDE","Pose与Yaw","OBB与SAT"]}],"english":[{"category":"english","type":"论文阅读词汇","title":"trajectory","summary":"名词：轨迹；指物体或系统随时间变化的位置路径。","tags":["名词","自动驾驶","运动规划"],"sections":[{"heading":"常见搭配","body":"trajectory prediction（轨迹预测）；future trajectory（未来轨迹）；planned trajectory（规划轨迹）；trajectory generation（轨迹生成）。"},{"heading":"论文语境","body":"在自动驾驶论文中，trajectory通常指车辆或交通参与者在未来一段时间内的位置序列，可能同时包含朝向、速度等状态信息。"}],"example":"The model predicts the future trajectory of the ego vehicle.（模型预测自车的未来轨迹。）"},{"category":"english","type":"论文阅读词汇","title":"inference","summary":"名词：推理；在机器学习中通常指使用训练好的模型对输入进行计算并产生输出。","tags":["名词","机器学习","模型部署"],"sections":[{"heading":"常见搭配","body":"model inference（模型推理）；inference time（推理时间）；real-time inference（实时推理）；inference pipeline（推理流程）。"},{"heading":"与training的区别","body":"Training是训练模型、更新参数；inference通常是使用已训练模型进行预测，不以更新模型参数为目的。"}],"example":"The model supports real-time inference.（该模型支持实时推理。）"},{"category":"english","type":"论文阅读词汇","title":"autoregressive","summary":"形容词：自回归的；表示当前输出依赖先前输出或状态。","tags":["形容词","生成模型","序列建模"],"sections":[{"heading":"常见搭配","body":"autoregressive model（自回归模型）；autoregressive generation（自回归生成）；autoregressive prediction（自回归预测）。"},{"heading":"阅读提示","body":"看到autoregressive时，重点关注模型如何把前一步输出反馈为下一步输入，以及误差是否可能随时间累积。"}],"example":"The model generates future states in an autoregressive manner.（模型以自回归方式生成未来状态。）"}]};
const data=Object.values(embedded).flat();let selected="all";const $=id=>document.getElementById(id);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){const q=$("q").value.trim().toLowerCase(),cat=files.find(x=>x[0]===selected);$("heading").textContent=cat?cat[1]:"全部知识";$("desc").textContent=cat?({math:"理解公式背后的数学与物理原理。",ai:"从编程基础逐步扩展到机器学习、深度学习与通用AI模型。",driving:"连接车辆运动、自动驾驶技术、实验评价与科研方法。",papers:"每篇论文独立建档，记录问题、方法、实验、结论与个人思考。",english:"积累论文阅读中遇到的词汇、语境、搭配与例句。"}[selected]):"按分类浏览，也可以搜索标题、解释和标签。";let shown=data.filter(x=>(selected==="all"||x.category===selected)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$("cards").innerHTML=shown.length?shown.map(x=>'<article class="card"><div class="meta">'+esc(files.find(c=>c[0]===x.category)?.[1]||"")+' · '+esc(x.type||"知识点")+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p><div>'+(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div><details><summary>查看详细内容</summary>'+(x.sections||[]).map(s=>'<p><b>'+esc(s.heading)+'</b></p><p>'+esc(s.body)+'</p>').join("")+(x.formula?'<p><b>公式：</b><code>'+esc(x.formula)+'</code></p>':"")+(x.example?'<p><b>例子：</b>'+esc(x.example)+'</p>':"")+(x.related?.length?'<p><b>关联知识：</b>'+x.related.map(esc).join("、")+'</p>':"")+'</details></article>').join(""):'<div class="empty">没有找到匹配的知识卡片。试试其他关键词。</div>';$("count").textContent='当前显示 '+shown.length+' / '+data.length+' 张知识卡片';document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.id===selected));$("all").classList.toggle("active",selected==="all");}
function initCats(){$("cats").innerHTML='<button class="cat active" data-id="all">全部知识 <small>'+data.length+'</small></button>'+files.map(c=>'<button class="cat" data-id="'+c[0]+'">'+c[1]+' <small>'+data.filter(x=>x.category===c[0]).length+'</small></button>').join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});}
$("q").addEventListener("input",render);$("all").onclick=()=>{selected="all";render()};$("clear").onclick=()=>{$("q").value="";render()};initCats();render();
</script></body></html>
