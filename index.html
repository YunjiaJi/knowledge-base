<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础知识库</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#243247;--muted:#65758b;--line:#e1e8f0;--blue:#315f91;--soft:#edf3fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{background:linear-gradient(120deg,#183653,#315f91);color:white;padding:30px 22px}header .wrap,main,footer{max-width:1180px;margin:auto}h1{margin:4px 0;font-size:29px}header p{margin:4px 0;color:#dce8f4}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8}.stats{display:flex;gap:10px;margin-top:16px}.stat{border:1px solid #ffffff44;background:#ffffff18;border-radius:10px;padding:8px 14px}.stat b{font-size:20px;display:block}main{padding:22px 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;color:var(--ink)}input{flex:1;min-width:220px}button{cursor:pointer}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.panel,.content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.cat{display:flex;width:100%;justify-content:space-between;text-align:left;margin:5px 0}.cat.active{background:var(--soft);border-color:#a9bfd8;color:#244d79}.cat small,.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:15px}.card h3{margin:3px 0 6px;font-size:17px}.meta{font-size:12px;color:var(--muted)}.tag{display:inline-block;background:var(--soft);color:var(--blue);border-radius:20px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0}.card p{margin:7px 0}.card details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.card summary{cursor:pointer;color:var(--blue);font-weight:600}.section{margin:10px 0}.section b{display:block;margin-bottom:3px}.formula{background:#f0f5fa;padding:9px 11px;border-left:3px solid var(--blue);border-radius:7px;margin:8px 0}.empty{padding:30px;text-align:center;color:var(--muted)}footer{padding:0 18px 30px;color:var(--muted);font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div class="eyebrow">PERSONAL LEARNING LIBRARY</div><h1>基础知识库</h1><p>把每次讲解沉淀成可搜索、可复习、可持续更新的知识卡片。</p><div class="stats"><div class="stat"><b id="total">…</b>知识卡片</div><div class="stat"><b>5</b>主题书架</div></div></div></header>
<main><div class="toolbar"><input id="q" placeholder="搜索知识点、公式、关键词……"><button id="clear">清除搜索</button></div><div class="layout"><aside class="panel"><b>知识分类</b><div id="cats"></div><p class="muted">点击分类浏览，也可以跨分类搜索。</p></aside><section class="content"><h2 id="heading">全部知识</h2><p class="muted" id="desc">正在读取知识卡片…</p><div id="cards" class="cards"></div><p class="muted" id="count"></p></section></div></main><footer>新增知识点时，可以在对话中说“收录到基础知识库”。内容按主题保存在 data/*.json，网页自动读取数据。</footer>
<script>
const files=[["math","数学与物理基础","公式原理、运动学、力学、三角函数"],["ai","计算机与人工智能基础","Python、PyTorch、深度学习与生成模型"],["driving","自动驾驶与研究方法","车辆运动、轨迹评价、碰撞检测与实验方法"],["papers","论文知识库","每篇论文独立记录研究问题、方法、数据和结论"],["english","英语词汇库","论文阅读词汇、搭配、例句与易混词"]];
let data={},selected="all";
const $=id=>document.getElementById(id);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){let results=await Promise.all(files.map(async f=>{try{let r=await fetch("./data/"+f[0]+".json");if(!r.ok)throw Error(r.status);return [f[0],await r.json()]}catch(e){return [f[0],[]]}}));results.forEach(([k,v])=>data[k]=v);$("total").textContent=Object.values(data).reduce((n,a)=>n+a.length,0);renderCats();render();}
function renderCats(){$("cats").innerHTML='<button class="cat active" data-id="all">全部知识 <small>'+Object.values(data).reduce((n,a)=>n+a.length,0)+'</small></button>'+files.map(f=>'<button class="cat" data-id="'+f[0]+'">'+f[1]+' <small>'+(data[f[0]]||[]).length+'</small></button>').join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderCats();render()});}
function render(){let q=$("q").value.trim().toLowerCase(),f=files.find(x=>x[0]===selected);$("heading").textContent=f?f[1]:"全部知识";$("desc").textContent=f?f[2]:"按主题浏览，也可以搜索标题、正文、公式和标签。";let all=Object.entries(data).flatMap(([k,a])=>a.map(x=>({...x,_cat:k})));let shown=all.filter(x=>(selected==="all"||x._cat===selected)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$("cards").innerHTML=shown.length?shown.map(x=>'<article class="card"><div class="meta">'+esc(files.find(f=>f[0]===x._cat)?.[1]||"")+' · '+esc(x.type||"知识点")+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||"")+'</p><div>'+(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div><details><summary>查看详细内容</summary>'+(x.formula?'<div class="formula">'+esc(x.formula)+'</div>':"")+(x.sections||[]).map(s=>'<div class="section"><b>'+esc(s.heading)+'</b><div>'+esc(s.body)+'</div></div>').join("")+(x.example?'<div class="section"><b>例子</b><div>'+esc(x.example)+'</div></div>':"")+(x.related?.length?'<div class="section"><b>关联知识</b><div>'+x.related.map(esc).join("、")+'</div></div>':"")+'</details></article>').join(""):'<div class="empty">没有找到匹配的知识卡片。</div>';$("count").textContent="当前显示 "+shown.length+" / "+all.length+" 张卡片";}
$("q").addEventListener("input",render);$("clear").onclick=()=>{$("q").value="";render()};load();
</script></body></html>
